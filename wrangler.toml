name = "pan-search"
main = "apps/worker/src/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "apps/admin/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "pan-search"
database_id = "1e50c5b9-e8df-4859-ba26-a416481c5792"
migrations_dir = "drizzle/migrations"

[[kv_namespaces]]
binding = "KV"
id = "cd00ed5ada1b4c0d915fe04d7b810225"

[[r2_buckets]]
binding = "R2"
bucket_name = "pan-search-uploads"

[[queues.producers]]
binding = "TRANSFER_QUEUE"
queue = "pan-transfer"

[[queues.consumers]]
queue = "pan-transfer"
max_batch_size = 5
max_retries = 3

[triggers]
crons = ["*/10 * * * *", "0 */12 * * *", "0 3 * * *"]

[vars]
APP_NAME = "PanSearch"
SYSTEM_SALT = "qfshop"
ENCRYPT_KEY = "verveu0v87e80ru0ev0euv3f2f3"
ENCRYPT_IV = "k1h2i3o4b5b6o7b8"

# Secrets (set via: wrangler secret put ...):
# ADMIN_BOOTSTRAP_PASSWORD
